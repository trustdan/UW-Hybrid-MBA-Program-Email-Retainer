name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify dependencies
        run: go mod verify
      - name: Code Vet
        run: go vet ./...
      - name: Run Tests
        run: go test -v ./...
      - name: Build binary
        run: go build -trimpath -ldflags="-s -w -X main.version=ci-${{ github.sha }}" -o dist/hmba-mail ./cmd/hmba-mail
